<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>IronPulse - Gym Workout Tracker</title>
    
    <style>
        :root {
            --bg: #09090b;
            --card: #18181b;
            --card-secondary: #27272a;
            --border: #27272a;
            --border-highlight: rgba(255, 255, 255, 0.15);
            --primary: #3b82f6;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: max(12px, var(--sat));
            padding-bottom: max(90px, calc(75px + var(--sab)));
            overflow-x: hidden;
        }

        /* Responsive Container */
        .app-shell {
            width: 100%;
            max-width: 480px;
            padding: 0 12px;
        }

        /* Glass Header */
        header {
            width: 100%;
            max-width: 480px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(24, 24, 27, 0.85);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
            margin-bottom: 12px;
            border-radius: 0 0 16px 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--success));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Routine Segmented Switcher */
        .segmented-nav {
            display: flex;
            background: var(--card);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            gap: 4px;
        }

        .segment-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .segment-btn.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }

        /* Cards & Exercise Lists */
        .glass-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .ex-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .ex-name {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ex-ghost {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            font-weight: 500;
        }

        .btn-add-set {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Set Row & Touch Inputs */
        .set-row {
            background: #121215;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .set-row.done {
            background: rgba(34, 197, 94, 0.08);
            border-color: rgba(34, 197, 94, 0.4);
        }

        .set-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .set-badge {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            width: 22px;
        }

        .input-group {
            flex: 1;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-label {
            font-size: 9px;
            font-weight: 800;
            color: var(--text-muted);
        }

        .num-input {
            width: 44px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .stepper-btn {
            width: 28px;
            height: 28px;
            background: var(--card-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stepper-btn:active {
            background: var(--border-highlight);
        }

        .check-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-secondary);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.15s ease;
        }

        .check-btn.done {
            background: var(--success);
            color: #000;
            border-color: var(--success);
            box-shadow: 0 2px 10px rgba(34, 197, 94, 0.3);
        }

        .quick-adjust {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .pill-btn:active {
            color: #fff;
            border-color: #fff;
        }

        /* Main Save Button */
        .btn-complete {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #000;
            font-size: 16px;
            font-weight: 800;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.25);
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .btn-complete:active {
            transform: scale(0.98);
        }

        /* Analytics Chart Canvas */
        .chart-container {
            width: 100%;
            height: 200px;
            background: #121215;
            border-radius: 14px;
            padding: 10px;
            margin-top: 12px;
            position: relative;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Bottom Sticky Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(18, 18, 21, 0.92);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding-top: 8px;
            padding-bottom: max(10px, var(--sab));
            z-index: 40;
        }

        .nav-grid {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .tab-panel {
            display: block;
        }

        .tab-panel.hidden {
            display: none !important;
        }

        select {
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body>

    <!-- Header Shell -->
    <header>
        <div class="brand">
            <div class="brand-logo">⚡</div>
            <div>
                <div class="brand-title">IronPulse</div>
                <div class="brand-sub">Gym Tracker • kg</div>
            </div>
        </div>
    </header>

    <!-- Main Content Shell -->
    <main class="app-shell">

        <!-- TAB 1: WORKOUT LOGGING -->
        <section id="tab-workout" class="tab-panel">
            <div class="segmented-nav">
                <button onclick="switchRoutine('Push')" id="btn-routine-Push" class="segment-btn active">
                    <span>🏋️</span> Push
                </button>
                <button onclick="switchRoutine('Pull')" id="btn-routine-Pull" class="segment-btn">
                    <span>🦾</span> Pull
                </button>
                <button onclick="switchRoutine('Leg')" id="btn-routine-Leg" class="segment-btn">
                    <span>🦵</span> Legs
                </button>
            </div>

            <!-- Exercises rendered dynamically -->
            <div id="exerciseList"></div>

            <button onclick="completeSession()" class="btn-complete">
                ✓ Complete & Save Workout
            </button>
        </section>

        <!-- TAB 2: ANALYTICS & PRs -->
        <section id="tab-analytics" class="tab-panel hidden">
            <div class="glass-card">
                <h2 style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 8px;">Strength Progress</h2>
                <select id="analyticsSelect" onchange="renderAnalyticsChart()" style="width: 100%; background: #121215; border: 1px solid var(--border); border-radius: 12px; padding: 10px; color: #fff; font-size: 13px; font-weight: 700; outline: none; margin-bottom: 8px;">
                </select>

                <div class="chart-container">
                    <canvas id="progressionCanvas"></canvas>
                </div>
            </div>

            <div class="glass-card">
                <h3 style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 10px;">Personal Records (Max Weight)</h3>
                <div id="prContainer" style="font-size: 13px;"></div>
            </div>
        </section>

        <!-- TAB 3: WORKOUT HISTORY -->
        <section id="tab-history" class="tab-panel hidden">
            <h2 style="font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; padding-left: 2px;">Workout History</h2>
            <div id="historyContainer"></div>
        </section>

        <!-- TAB 4: SETTINGS & DATA -->
        <section id="tab-settings" class="tab-panel hidden">
            <div class="glass-card">
                <h2 style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 6px;">Data Backup & Export</h2>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4;">Save a JSON backup file to sync your workout history across multiple browsers or devices.</p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                    <button onclick="exportData()" style="background: var(--card-secondary); border: 1px solid var(--border); color: var(--primary); font-weight: 800; padding: 12px; border-radius: 12px; font-size: 13px; cursor: pointer;">Export Backup</button>
                    <label style="background: var(--card-secondary); border: 1px solid var(--border); color: var(--success); font-weight: 800; padding: 12px; border-radius: 12px; font-size: 13px; cursor: pointer; text-align: center; display: block;">
                        Import JSON
                        <input type="file" id="importInput" onchange="importData(event)" style="display: none;" accept=".json">
                    </label>
                </div>

                <button onclick="resetAllData()" style="width: 100%; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); font-weight: 800; padding: 12px; border-radius: 12px; font-size: 13px; cursor: pointer;">Clear All Data</button>
            </div>
        </section>

    </main>

    <!-- Bottom Nav Shell -->
    <nav class="bottom-nav">
        <div class="nav-grid">
            <button onclick="switchTab('workout')" id="nav-workout" class="nav-btn active">
                <span style="font-size: 18px;">🏋️</span>
                <span>Workout</span>
            </button>
            <button onclick="switchTab('analytics')" id="nav-analytics" class="nav-btn">
                <span style="font-size: 18px;">📊</span>
                <span>Analytics</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="nav-btn">
                <span style="font-size: 18px;">📜</span>
                <span>History</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn">
                <span style="font-size: 18px;">⚙️</span>
                <span>Settings</span>
            </button>
        </div>
    </nav>

    <!-- Application JavaScript Logic -->
    <script>
        // 1. Data Definitions & Preset Routines
        const ROUTINES = {
            Push: [
                { name: "Incline Chest Press", emoji: "🏋️" },
                { name: "Flat Bench Chest Press", emoji: "🛋️" },
                { name: "Shoulder Press", emoji: "🦾" },
                { name: "Side Lateral Raise", emoji: "🦅" },
                { name: "Triceps Extension", emoji: "⚡" }
            ],
            Pull: [
                { name: "Upper Back Row", emoji: "🛶" },
                { name: "Lat Row", emoji: "💪" },
                { name: "Lat Pull Down", emoji: "🏋️" },
                { name: "Biceps Curl", emoji: "🪙" },
                { name: "Hammer Curl", emoji: "🔨" }
            ],
            Leg: [
                { name: "Leg Extension", emoji: "🦵" },
                { name: "Leg Curl", emoji: "🦿" },
                { name: "Walking Split Lunges", emoji: "🚶" }
            ]
        };

        let currentRoutine = 'Push';
        let activeTab = 'workout';
        let store = { history: [] };
        let currentSession = { day: 'Push', exercises: {} };

        // 2. Storage Helpers (Safe against Sandbox restrictions)
        function loadData() {
            try {
                const saved = localStorage.getItem('ironpulse_v2_data');
                if (saved) store = JSON.parse(saved);
            } catch(e) {
                console.warn("Storage warning:", e);
            }
        }

        function saveData() {
            try {
                localStorage.setItem('ironpulse_v2_data', JSON.stringify(store));
            } catch(e) {
                console.warn("Save warning:", e);
            }
        }

        function triggerHaptic() {
            if ("vibrate" in navigator) {
                try { navigator.vibrate(15); } catch(e) {}
            }
        }

        // 3. App Initialization
        function init() {
            loadData();
            switchRoutine('Push');
            populateAnalyticsDropdown();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // 4. Tab Navigation
        function switchTab(tab) {
            triggerHaptic();
            activeTab = tab;

            document.querySelectorAll('.tab-panel').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');

            if (tab === 'history') renderHistory();
            if (tab === 'analytics') {
                populateAnalyticsDropdown();
                renderAnalyticsChart();
                renderPRs();
            }
        }

        // 5. Routine Switcher & Exercise Generator
        function switchRoutine(day) {
            triggerHaptic();
            currentRoutine = day;

            document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-routine-${day}`).classList.add('active');

            if (currentSession.day !== day) {
                currentSession.day = day;
                currentSession.exercises = {};

                ROUTINES[day].forEach(ex => {
                    const lastLog = getPreviousExerciseLog(ex.name);
                    currentSession.exercises[ex.name] = [];

                    if (lastLog && lastLog.sets.length > 0) {
                        lastLog.sets.forEach(s => {
                            currentSession.exercises[ex.name].push({ weight: s.weight, reps: s.reps, done: false });
                        });
                    } else {
                        currentSession.exercises[ex.name] = [
                            { weight: 20, reps: 10, done: false },
                            { weight: 20, reps: 10, done: false },
                            { weight: 20, reps: 10, done: false }
                        ];
                    }
                });
            }

            renderExercises();
        }

        function getPreviousExerciseLog(exName) {
            for (let i = store.history.length - 1; i >= 0; i--) {
                const session = store.history[i];
                if (session.exercises && session.exercises[exName]) {
                    return session.exercises[exName];
                }
            }
            return null;
        }

        function renderExercises() {
            const list = document.getElementById('exerciseList');
            list.innerHTML = '';

            ROUTINES[currentRoutine].forEach(ex => {
                const exName = ex.name;
                const lastLog = getPreviousExerciseLog(exName);
                const ghostText = lastLog 
                    ? lastLog.sets.map(s => `${s.weight}k×${s.reps}`).join(', ')
                    : 'No previous log';

                const card = document.createElement('div');
                card.className = 'glass-card';

                const setsHtml = currentSession.exercises[exName].map((set, setIdx) => `
                    <div class="set-row ${set.done ? 'done' : ''}">
                        <div class="set-controls">
                            <span class="set-badge">#${setIdx + 1}</span>

                            <div class="input-group">
                                <span class="input-label">KG</span>
                                <input type="number" step="0.5" value="${set.weight}" onchange="updateSetVal('${exName}', ${setIdx}, 'weight', this.value)" class="num-input">
                                <div style="display:flex; gap:2px;">
                                    <button onclick="stepWeight('${exName}', ${setIdx}, -2.5)" class="stepper-btn">-</button>
                                    <button onclick="stepWeight('${exName}', ${setIdx}, 2.5)" class="stepper-btn">+</button>
                                </div>
                            </div>

                            <div class="input-group">
                                <span class="input-label">REPS</span>
                                <input type="number" value="${set.reps}" onchange="updateSetVal('${exName}', ${setIdx}, 'reps', this.value)" class="num-input">
                                <div style="display:flex; gap:2px;">
                                    <button onclick="stepReps('${exName}', ${setIdx}, -1)" class="stepper-btn">-</button>
                                    <button onclick="stepReps('${exName}', ${setIdx}, 1)" class="stepper-btn">+</button>
                                </div>
                            </div>

                            <button onclick="toggleSetDone('${exName}', ${setIdx})" class="check-btn ${set.done ? 'done' : ''}">✓</button>
                        </div>

                        <div class="quick-adjust">
                            <button onclick="stepWeight('${exName}', ${setIdx}, -1)" class="pill-btn">-1kg</button>
                            <button onclick="stepWeight('${exName}', ${setIdx}, 1)" class="pill-btn">+1kg</button>
                            <button onclick="stepWeight('${exName}', ${setIdx}, 5)" class="pill-btn">+5kg</button>
                            <button onclick="removeSet('${exName}', ${setIdx})" class="pill-btn" style="color:var(--danger);">Delete</button>
                        </div>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div class="ex-header">
                        <div>
                            <div class="ex-name"><span>${ex.emoji}</span> <span>${exName}</span></div>
                            <div class="ex-ghost">Last: ${ghostText}</div>
                        </div>
                        <button onclick="addSet('${exName}')" class="btn-add-set">+ Set</button>
                    </div>
                    <div>${setsHtml}</div>
                `;

                list.appendChild(card);
            });
        }

        // 6. Set Modifiers
        function updateSetVal(exName, setIdx, field, val) {
            currentSession.exercises[exName][setIdx][field] = parseFloat(val) || 0;
        }

        function stepWeight(exName, setIdx, delta) {
            triggerHaptic();
            const set = currentSession.exercises[exName][setIdx];
            set.weight = Math.max(0, parseFloat((set.weight + delta).toFixed(1)));
            renderExercises();
        }

        function stepReps(exName, setIdx, delta) {
            triggerHaptic();
            const set = currentSession.exercises[exName][setIdx];
            set.reps = Math.max(0, set.reps + delta);
            renderExercises();
        }

        function toggleSetDone(exName, setIdx) {
            triggerHaptic();
            const set = currentSession.exercises[exName][setIdx];
            set.done = !set.done;
            renderExercises();
        }

        function addSet(exName) {
            triggerHaptic();
            const sets = currentSession.exercises[exName];
            const last = sets.length > 0 ? sets[sets.length - 1] : { weight: 20, reps: 10 };
            sets.push({ weight: last.weight, reps: last.reps, done: false });
            renderExercises();
        }

        function removeSet(exName, setIdx) {
            triggerHaptic();
            if (currentSession.exercises[exName].length > 1) {
                currentSession.exercises[exName].splice(setIdx, 1);
                renderExercises();
            }
        }

        // 7. Complete & Save Session
        function completeSession() {
            triggerHaptic();
            const formattedDate = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            const record = {
                id: Date.now(),
                date: formattedDate,
                day: currentRoutine,
                exercises: {}
            };

            let loggedAny = false;

            Object.keys(currentSession.exercises).forEach(exName => {
                const completedSets = currentSession.exercises[exName].filter(s => s.done);
                if (completedSets.length > 0) {
                    loggedAny = true;
                    record.exercises[exName] = {
                        sets: completedSets.map(s => ({ weight: s.weight, reps: s.reps }))
                    };
                }
            });

            if (!loggedAny) {
                alert("Please check off at least one completed set before saving.");
                return;
            }

            store.history.push(record);
            saveData();

            currentSession.exercises = {};
            switchRoutine(currentRoutine);
            switchTab('history');
        }

        // 8. History Renderer
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            if (store.history.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:30px 0; font-size:13px;">No workouts logged yet.</p>`;
                return;
            }

            [...store.history].reverse().forEach(session => {
                const card = document.createElement('div');
                card.className = 'glass-card';

                let exHtml = '';
                Object.keys(session.exercises).forEach(ex => {
                    const setsStr = session.exercises[ex].sets.map(s => `${s.weight}kg×${s.reps}`).join('  ');
                    exHtml += `
                        <div style="display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                            <span style="color:var(--text-muted);">${ex}</span>
                            <span style="color:var(--success); font-weight:700;">${setsStr}</span>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--border);">
                        <div>
                            <span style="font-size:13px; font-weight:800; color:var(--primary); text-transform:uppercase;">${session.day} Day</span>
                            <div style="font-size:10px; color:var(--text-muted);">${session.date}</div>
                        </div>
                        <button onclick="deleteSession(${session.id})" style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-weight:700; font-size:12px;">Delete</button>
                    </div>
                    <div>${exHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function deleteSession(id) {
            if (confirm("Delete this workout session?")) {
                store.history = store.history.filter(item => item.id !== id);
                saveData();
                renderHistory();
            }
        }

        // 9. Analytics Chart & PR Renderer
        function populateAnalyticsDropdown() {
            const select = document.getElementById('analyticsSelect');
            select.innerHTML = '';

            const allExercises = [];
            Object.keys(ROUTINES).forEach(d => {
                ROUTINES[d].forEach(e => allExercises.push(e.name));
            });

            allExercises.forEach(ex => {
                const opt = document.createElement('option');
                opt.value = ex;
                opt.textContent = ex;
                select.appendChild(opt);
            });
        }

        function renderAnalyticsChart() {
            const exercise = document.getElementById('analyticsSelect').value;
            const canvas = document.getElementById('progressionCanvas');
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext('2d');

            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            ctx.scale(2, 2);

            const points = [];
            store.history.forEach(session => {
                if (session.exercises && session.exercises[exercise]) {
                    let maxW = 0;
                    session.exercises[exercise].sets.forEach(s => {
                        if (s.weight > maxW) maxW = s.weight;
                    });
                    if (maxW > 0) points.push({ date: session.date, weight: maxW });
                }
            });

            const w = rect.width;
            const h = rect.height;
            ctx.clearRect(0, 0, w, h);

            if (points.length === 0) {
                ctx.fillStyle = '#a1a1aa';
                ctx.font = '12px -apple-system';
                ctx.textAlign = 'center';
                ctx.fillText('No history recorded yet for this exercise.', w / 2, h / 2);
                return;
            }

            const padX = 35;
            const padY = 25;
            const chartW = w - padX * 2;
            const chartH = h - padY * 2;

            const weights = points.map(p => p.weight);
            let minW = Math.min(...weights);
            let maxW = Math.max(...weights);
            if (minW === maxW) { minW -= 5; maxW += 5; }

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 3; i++) {
                const y = padY + (chartH / 3) * i;
                ctx.beginPath();
                ctx.moveTo(padX, y);
                ctx.lineTo(w - padX, y);
                ctx.stroke();

                const val = Math.round(maxW - ((maxW - minW) / 3) * i);
                ctx.fillStyle = '#a1a1aa';
                ctx.font = '10px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`${val}k`, padX - 6, y + 3);
            }

            const coords = points.map((p, idx) => {
                const x = points.length === 1 ? padX + chartW / 2 : padX + (chartW / (points.length - 1)) * idx;
                const y = padY + chartH - ((p.weight - minW) / (maxW - minW)) * chartH;
                return { x, y, weight: p.weight };
            });

            // Gradient area fill
            const grad = ctx.createLinearGradient(0, padY, 0, h - padY);
            grad.addColorStop(0, 'rgba(59, 130, 246, 0.35)');
            grad.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

            ctx.beginPath();
            ctx.moveTo(coords[0].x, h - padY);
            coords.forEach(c => ctx.lineTo(c.x, c.y));
            ctx.lineTo(coords[coords.length - 1].x, h - padY);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Line stroke
            ctx.beginPath();
            coords.forEach((c, i) => {
                if (i === 0) ctx.moveTo(c.x, c.y);
                else ctx.lineTo(c.x, c.y);
            });
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Data Points
            coords.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#3b82f6';
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`${c.weight}`, c.x, c.y - 8);
            });
        }

        function renderPRs() {
            const container = document.getElementById('prContainer');
            container.innerHTML = '';

            const allExercises = [];
            Object.keys(ROUTINES).forEach(d => {
                ROUTINES[d].forEach(e => allExercises.push(e.name));
            });

            allExercises.forEach(ex => {
                let maxWeight = 0;
                store.history.forEach(session => {
                    if (session.exercises && session.exercises[ex]) {
                        session.exercises[ex].sets.forEach(s => {
                            if (s.weight > maxWeight) maxWeight = s.weight;
                        });
                    }
                });

                if (maxWeight > 0) {
                    const row = document.createElement('div');
                    row.style.display = 'flex';
                    row.style.justifyContent = 'space-between';
                    row.style.padding = '6px 0';
                    row.style.borderBottom = '1px solid var(--border)';
                    row.innerHTML = `
                        <span style="color:#fff; font-weight:600;">${ex}</span>
                        <span style="color:var(--success); font-weight:800;">${maxWeight} kg</span>
                    `;
                    container.appendChild(row);
                }
            });

            if (container.children.length === 0) {
                container.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:10px 0;">No PRs logged yet.</p>`;
            }
        }

        // 10. Data Backup & Reset Helpers
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `ironpulse_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importData(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed && Array.isArray(parsed.history)) {
                        store = parsed;
                        saveData();
                        alert("Backup restored successfully!");
                        location.reload();
                    } else {
                        alert("Invalid JSON data format.");
                    }
                } catch (err) {
                    alert("Failed to parse JSON file.");
                }
            };
            reader.readAsText(event.target.files[0]);
        }

        function resetAllData() {
            if (confirm("Are you sure you want to clear all workout data?")) {
                try { localStorage.removeItem('ironpulse_v2_data'); } catch(e) {}
                location.reload();
            }
        }
    </script>
